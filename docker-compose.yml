name: ct-django

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "rrchnm/ct-django"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=connthreads
      - DB_USER=connthreads
      - DB_PASS=password
      - OBJ_STORAGE=False
    command: >
      sh -c "
        uv run --no-sync manage.py migrate &&
        uv run --no-sync daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    volumes:
      - dj-data:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=connthreads
      - POSTGRES_USER=connthreads
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connthreads"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  dj-data:
  pg-data:
