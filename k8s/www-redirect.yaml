---
# www.connectingthreads.co.uk -> the apex, at the Gateway. The k8s-django app
# HTTPRoute carries one hostname (FQDN), and Django never sees www requests.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  parentRefs:
    - group: gateway.networking.k8s.io   # explicit (API-server default) so Argo doesn't perma-diff
      kind: Gateway
      name: public
      namespace: platform
      sectionName: https
  hostnames:
    - www.connectingthreads.co.uk
  rules:
    # Explicit match (the API-server default) so Argo doesn't perma-diff.
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: connectingthreads.co.uk
            statusCode: 301
