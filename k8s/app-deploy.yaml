---
# This app's deployment parameters, read by the rrchnm-systems/k8s-django
# components (keys documented in that repo's README). Not name-hashed: the
# components' restore Job references it by name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-deploy
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
data:
  APP: ct-django
  FQDN: connectingthreads.co.uk
  DB_NAME: connthreads
  DB_USER: connthreads
  APP_SECRET: eso/ct-django
  RESTIC_REPO: connectingthreads.co.uk
  RESTIC_SECRET: eso/restic-ct
  MEDIA_BUCKET: connectingthreads.co.uk
