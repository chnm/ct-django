[tool.poetry]
name = "ct-django"
version = "0.1.0"
description = "Code and files for the Connecting Threads project."
authors = ["Jason Heppler <jason.heppler@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2.7"
django-htmx = "^1.26.0"
django-environ = "^0.12.0"
django-tailwind = "^4.3.1"
django-allauth = "^65.13.0"
psycopg2 = "^2.9.11"
wagtail = "^7.1"
django-taggit = "^6.1.0"
taggit-selectize = "^2.11.0"
python-dotenv = "^1.2.1"
django-modelcluster = "^6.3"
django-import-export = "^4.3.13"
django-admin-interface = "^0.30.1"
geopy = "^2.4.1"
django-tables2 = "^2.7.0"
django-filter = "^25.2"
fontawesomefree = "^6.6.0"
django-storages = "^1.14.6"
boto3 = "^1.40.64"
backoff = "^2.2.1"
ratelimit = "^2.2.1"
requests = "^2.32.5"
django-unfold = "^0.69.0"


[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
djhtml = "^3.0.10"
pre-commit = "^4.3.0"
django-debug-toolbar = "^6.1.0"
pytest-django = "^4.11.1"
pylint-django = "^2.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
