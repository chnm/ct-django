[project]
name = "config"
version = "0.1.7"
description = "Code and files for the Connecting Threads project."
authors = [{ name = "Jason Heppler", email = "jheppler@gmu.edu" }]
requires-python = "~=3.12.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "django>=5.0.6,<7",
    "django-htmx>=1.17.3,<2",
    "django-environ>=0.11.2,<0.13",
    "django-tailwind>=3.8.0,<5",
    "django-allauth>=0.62.1,<65.14",
    "wagtail~=7.2",
    "django-taggit>=5.0.1,<7",
    "taggit-selectize>=2.11.0,<3",
    "python-dotenv>=1.0.1,<2",
    "django-modelcluster~=6.3",
    "django-import-export>=4.0.7,<5",
    "django-admin-interface>=0.28.8,<0.33",
    "geopy>=2.4.1,<3",
    "django-tables2>=2.7.0,<3",
    "django-filter~=25.2",
    "fontawesomefree>=6.6.0,<7",
    "django-storages>=1.14.4,<2",
    "boto3>=1.35.27,<2",
    "backoff>=2.2.1,<3",
    "ratelimit>=2.2.1,<3",
    "requests>=2.32.3,<3",
    "django-unfold>=0.55.2,<0.75",
    "psycopg2-binary>=2.9.11",
    "django-prose>=2.1.0",
    "django-reversion>=6.1.0",
]

[dependency-groups]
dev = [
    "black>=24.4.2,<26",
    "djhtml>=3.0.6,<4",
    "pre-commit>=3.7.0,<5",
    "django-debug-toolbar>=4.3.0,<7",
    "pytest-django>=4.8.0,<5",
    "pylint-django>=2.5.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
