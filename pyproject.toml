[project]
name = "config"
version = "0.1.7"
description = "Code and files for the Connecting Threads project."
authors = [{ name = "Jason Heppler", email = "jheppler@gmu.edu" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "django>=6.1.3,<6.2",
    "gunicorn>=27.0.1,<28",
    "whitenoise>=6.12.0,<7",
    "django-htmx>=1.29.0,<2",
    "django-environ>=0.14.0,<0.15",
    "django-tailwind>=4.6.0,<5",
    "django-allauth>=65.22.1,<66",
    "wagtail>=8.1,<9",
    "django-taggit>=7.0.0,<8",
    "django-modelcluster>=6.5,<7",
    "django-import-export>=4.4.5,<5",
    "geopy>=2.5.0,<3",
    "django-tables2>=3.0.1,<4",
    "django-filter>=26.2,<27",
    "fontawesomefree>=6.6.0,<7",
    "django-storages>=1.14.6,<2",
    "boto3>=1.44.3,<2",
    "backoff>=2.2.1,<3",
    "ratelimit>=2.2.1,<3",
    "requests>=2.34.2,<3",
    "django-unfold>=0.110.1,<0.111",
    "psycopg2-binary>=2.9.13,<3",
    "django-prose>=2.1.0",
    "django-reversion>=6.5.2,<7",
]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "djhtml>=3.0.11,<4",
    "pre-commit>=4.7.0,<5",
    "django-debug-toolbar>=8.0.0,<9",
    "pytest-django>=4.14.0,<5",
    "pylint-django>=2.8.0,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*.py", "static/js/openseadragon/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
